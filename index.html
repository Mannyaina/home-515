async function write(fn){

function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file);var i=new Image();i.onload=function(){res({img:i,u:u})};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
function toCanvas(img,max){var s=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
async function storeImage(file){
  var L=await loadImg(file);
  try{
    if(assets){
      try{var c=toCanvas(L.img,1400);var blob=await new Promise(function(r){c.toBlob(r,'image/jpeg',0.82)});var a=await assets.upload(blob);if(a&&a.id)return {id:a.id}}catch(e){}
    }
    var c2=toCanvas(L.img,640);return {data:c2.toDataURL('image/jpeg',0.7)};
  }finally{URL.revokeObjectURL(L.u)}
}
async function storeFile(file){
  if(file.type&&file.type.indexOf('image/')===0){var p=await storeImage(file);return Object.assign({name:file.name||'photo.jpg',kind:'image'},p)}
  if(!assets)throw new Error('noassets');
  var a=await assets.upload(file);return {name:file.name||'file',kind:'file',id:a.id};
}

function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function startOfToday(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function todoLate(t){return !t.done&&!!t.due&&t.due<todayKey()}
function dueLabel(t){
  if(!t.due)return 'No date';
  var p=t.due.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]),t0=new Date();t0.setHours(0,0,0,0);
  var diff=Math.round((d-t0)/86400000),nice=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  if(t.done)return 'Due '+nice;
  if(diff<0)return 'Was due '+nice;
  if(diff===0)return 'Due today';
  if(diff===1)return 'Due tomorrow';
  return 'Due '+nice;
}
function todoMine(t){var f=S.todoFilter||'Both';return f==='Both'||t.who===f||t.who==='Both'}
function avatar(who){var bg=who==='Dee'?'#0B6A6C':who==='Manny'?'#C23A24':'#8A6400';return '<span aria-label="'+(who==='Both'?'Both of you':esc(who))+'" style="min-width:30px;height:30px;padding:0 6px;box-sizing:border-box;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:#fff;background:'+bg+'">'+(who==='Both'?'M+D':esc((who||'?').charAt(0)))+'</span>'}
function todoRow(t){

function commitments(key){

  var tx=((F&&F.recent)||[]).filter(function(t){return t.amt<0&&monthKeyOf(t.at)===key});
  billsFor(key).forEach(function(b){
    var amt=Number(b.amount)||0,auto=null;
    if(!b.isPaid)auto=tx.find(function(t){return namesMatch(b.name,t.name)&&Math.abs(-t.amt-amt)<=Math.max(2,amt*0.15)})||null;
    out.push({src:'bill',id:b.id,name:b.name,amt:amt,day:b.dueDay,rep:b.repeat==='once'?'one-off':b.repeat==='yearly'?'once a year':'every month on the '+ord(b.dueDay),paid:b.isPaid||!!auto,auto:!!auto&&!b.isPaid,kind:b.repeat==='once'?'One-off bill':b.repeat==='yearly'?'Yearly bill':'Bill',cat:b.who?(b.who==='Split'?'split 50/50':b.who+' pays'):'',files:(b.files||[]).length});
  });
  ((F&&F.regular)||[]).forEach(function(r){
    if(regState(r.id)!=='accepted')return;
    if(out.some(function(o){return o.src==='bill'&&namesMatch(o.name,r.name)}))return;
    var p=(r.pay||[]).find(function(x){return x.k===key});
    var due=p?p.d:expectedDay(r,key);if(due==null)return;
    out.push({src:'reg',id:r.id,name:r.name,rep:(r.gap||30)<=45?'every month on the '+ord(r.day):'about every '+Math.max(2,Math.round(r.gap/30))+' months',amt:p?p.a:r.amt,day:Math.min(due,mInfo(key).days),paid:!!p,auto:!!p,kind:r.kind,cat:r.cat,files:0});
  });
  return out.sort(function(a,b){return a.day-b.day});
}

  var when=c.paid?'Went out '+ds+(monthly?' · next '+nx:c.rep?' · '+c.rep:''):(late?'Was due ':'Goes out ')+ds+(c.rep?' · '+c.rep:'');

  if(a==='rmFile'&&S.sheet){S.sheet.files.splice(Number(val),1);render();return}
  if(a==='tick'){var wasOpen=S.sheet&&S.sheet.id===id;await write(function(){return col('items').doc(id).update({done:true,doneBy:S.me||'',doneAt:Date.now()})});if(wasOpen){S.sheet=null;render()}return}
  if(a==='again'){var wo=S.sheet&&S.sheet.id===id;await write(function(){return col('items').doc(id).update({done:false,doneBy:null,doneAt:null,addedBy:S.me||'',createdAt:Date.now()})});if(wo){S.sheet=null;render()}return}
  if(a==='togglePaid'){
    var bb=S.bills.find(function(x){return x.id===id});if(!bb)return;var key=monthKey(S.monthOff);
    var body=JSON.parse(JSON.stringify(bb));delete body.id;body.paid=body.paid||{};
    if(body.paid[key])delete body.paid[key];else body.paid[key]={by:S.me||'',at:Date.now()};
    await write(function(){return col('bills').doc(id).set(body)});render();return;
  }
  if(a==='delBill'||a==='delItem'){
    if(!S.sheet.confirm){S.sheet.confirm=true;render();return}
    var ok=await write(function(){return col(a==='delBill'?'bills':'items').doc(id).delete()});
    if(ok){S.sheet=null;render()}return;
  }
  if(a==='clearNote'){var ok5=await write(function(){return db.doc('home/note').set({text:'',by:S.me||'',at:Date.now()})});if(ok5){S.sheet=null;render()}return}
  if(a==='examples'){await addExamples();return}
  if(a==='clearExamples'){
    var dels=S.bills.filter(function(b){return b.example}).map(function(b){return ['bills',b.id]}).concat(S.items.filter(function(i){return i.example}).map(function(i){return ['items',i.id]}));
    for(var i=0;i<dels.length;i++){var d=dels[i];if(!(await write(function(){return col(d[0]).doc(d[1]).delete()})))break}
    toast('Example data removed.');return;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});

async function addExamples(){
  if(S.busy)return;S.busy=true;
  var now=Date.now(),me=S.me||'Manny',start=monthKey(0);
  var bills=[['Rent',1450,1,'Split'],['Council tax',168,1,'Manny'],['Energy',92,14,'Manny'],['Water',38,15,'Dee'],['Broadband',32,18,'Split'],['Phones',45,22,'Split'],['Car insurance',64,28,'Manny'],['Streaming',18,28,'Dee']];
  var items=[['Washing-up liquid','The green one, 900ml — not lemon','Cleaning','Tesco'],['Laundry pods','Non-bio, purple tub','Laundry',''],['Rice — 10kg','Long grain, red bag','Food',''],['Plantain × 4','Ripe-ish','Food','']];
  try{
    for(var i=0;i<bills.length;i++){var b=bills[i];var paid={};if(b[2]===1)paid[start]={by:me,at:now-86400000*3};
      if(!(await write(function(){return col('bills').add({name:b[0],amount:b[1],day:b[2],repeat:'monthly',who:b[3],notes:'Example bill',month:null,start:start,files:[],paid:paid,createdAt:now-86400000*7,createdBy:me,updatedAt:now,example:true})})))return}
    for(var j=0;j<items.length;j++){var it=items[j];
      if(!(await write(function(){return col('items').add({name:it[0],note:it[1],category:it[2],store:it[3],photo:null,addedBy:j%2?'Dee':'Manny',createdAt:now-3600000*(j+1),done:false,example:true})})))return}
    toast('Examples added — tap any item to add a real photo.');
  }finally{S.busy=false}
}

/* ---------- boot ---------- */
var started=false,slowTimer=null;
async function startApp(){
  if(started)return;started=true;render();
  var m=await refreshMembers();
  if(m.error){started=false;S.noDb=true;render();return}
  var email=((S.session&&S.session.user.email)||'').toLowerCase();
  var mine=(S.members||[]).find(function(x){return x.email.toLowerCase()===email});
  if(!mine){S.notMember=true;started=false;render();return}
  S.notMember=false;S.me=mine.name;LS.set('515-me',S.me);
  db=makeDb();assets=makeAssets();
  slowTimer=setTimeout(function(){S.slow=true;render()},10000);
  var done=function(){if(S.loaded.bills&&S.loaded.items){clearTimeout(slowTimer);S.slow=false;if(!S.ready){S.ready=true;S.liveSince=Date.now()}}};
  col('bills').onSnapshot(function(snap){S.bills=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});S.loaded.bills=true;done();render()});
  col('items').onSnapshot(function(snap){S.items=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});S.loaded.items=true;done();render()});
  col('todos').onSnapshot(function(snap){S.todos=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});S.loaded.todos=true;render()});
  col('vault').onSnapshot(function(snap){S.vault=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});S.loaded.vault=true;render()});
  col('prefs').onSnapshot(function(snap){var mm={};snap.docs.forEach(function(d){mm[d.id]=d.data()});S.prefsAll=mm;render()});
  db.doc('finance/joint').onSnapshot(function(d){S.fin=d.exists?d.data():null;render()});
  db.doc('finance/prefs').onSnapshot(function(d){S.finPrefs=d.exists?d.data():{};render()});
  db.doc('finance/status').onSnapshot(function(d){S.mstat=d.exists?d.data():null;render()});
  col('budget').onSnapshot(function(snap){var mm={};snap.docs.forEach(function(d){mm[d.id]=d.data()});if(budPending&&S.budgets&&S.budgets[budKey()])mm[budKey()]=S.budgets[budKey()];S.budgets=mm;S.loaded.budget=true;render()});
  db.doc('home/note').onSnapshot(function(d){S.note=d.exists?d.data():null;render()});
  checkPush();
  var hsh=location.hash;goHash(hsh);
  if(hsh==='#monzo-approve'||hsh==='#monzo-error'){S.tab='money';S.mview='account';if(hsh==='#monzo-approve')S.monzoApprove=true;else setTimeout(function(){toast('The Monzo connection didn\u2019t finish \u2014 please try again.')},300);try{history.replaceState(null,'',location.pathname)}catch(e){}}
  render();
}
(async function(){
  render();
  if(!window.supabase){S.authReady=true;S.session={user:{email:''}};S.noDb=true;render();return}
  if('serviceWorker' in navigator){getReg();navigator.serviceWorker.addEventListener('message',function(ev){if(ev.data&&ev.data.type==='go'){try{goHash(new URL(ev.data.url).hash)}catch(e){}}})}
  window.addEventListener('hashchange',function(){goHash(location.hash)});
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,session){S.session=session;S.authReady=true;if(session)setTimeout(startApp,0);else{started=false;render()}});
  var r=await sb.auth.getSession();S.session=r.data.session;S.authReady=true;if(S.session)startApp();else render();
})();
})();
</script>
